<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaioba's Garage</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

</head>

          <a class="navbar-brand" href="#">

            Kaioba's-Garage
          </a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />

    </nav>
  </header>
  <label for="cars">Escolha um carro:</label>
  <select onchange="infos()" id="cars" name="carrs"></select>

  </header>

  <div id="infos">
  </div>
  <!-- Button trigger CAR modal -->
  <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
    Add New Car
  </button>

  <!-- Car Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">
        <!--modalHeader-->
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">
            <img src="./img/logo.png" alt="" width="30" height="24" class="d-inline-block align-text-top" />
            Kaioba's-Garage
          </h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!--modalBody-->
        <div class="modal-body">
          <!--idCar-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">ID</span>
            <input type="number" id="idCar" name="idCar" min="0">
          </div>
          <!--brand-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">Brand</span>
            <input type="text" class="form-control" aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default" id="brand" />
          </div>
          <!--model-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">Model</span>
            <input type="text" class="form-control" aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default" id="model" />
          </div>
          <!--motorID-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">Motor ID</span>
            <input type="number" id="motorID" name="motorID" min="0">
          </div>
          <!--color-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">Color:</span>
            <input type="color" class="form-control form-control-color" id="color" value="#563d7c"
              title="Choose your color">
          </div>

        </div>
        <!--footerModal-->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Close
          </button>
          <button type="submit" class="btn btn-primary" id="btnAdd" data-bs-dismiss="modal" onclick="addNewCar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
              class="bi bi-bookmark-plus" viewBox="0 0 16 16">
              <path
                d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z" />
              <path
                d="M8 4a.5.5 0 0 1 .5.5V6H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V7H6a.5.5 0 0 1 0-1h1.5V4.5A.5.5 0 0 1 8 4" />
            </svg>
            Add a Car
          </button>
        </div>
      </div>
    </div>
  </div>


  <!-- Button trigger MOTOR modal -->
  <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#exampleModal2">
    Add New Motor
  </button>

  <!-- Motor Modal -->
  <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel2" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">
        <!--modalHeader-->
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel2">
            <img src="./img/logo.png" alt="" width="30" height="24" class="d-inline-block align-text-top" />
            Kaioba's-Garage
          </h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!--modalBody-->
        <div class="modal-body">
          <!--idMotor-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">ID</span>
            <input type="number" id="idMotor" name="idMotor" min="0">
          </div>
          <!--cylinder-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">Number of cyllinder</span>
            <input type="text" class="form-control" aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default" id="cyllinder" />
          </div>
          <!--positionCylinder-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">Cylinder position</span>
            <input type="text" class="form-control" aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default" id="positionCylinder" />
          </div>
          <!--obs-->
          <div>
            <div class="input-group mb-3">
              <span class="input-group-text" d="inputGroup-sizing-default">Any observation</span>
              <input type="text" class="form-control" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default" id="obs" />
            </div>
          </div>
          <!--liters-->
          <div class="input-group mb-3">
            <span class="input-group-text" d="inputGroup-sizing-default">liters</span>
            <input type="number" id="liters" name="liters" min="0">
          </div>

        </div>
        <!--footerModal-->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Close
          </button>
          <button type="submit" class="btn btn-primary" id="btnAdd2" data-bs-dismiss="modal" onclick="addNewMotor()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
              class="bi bi-bookmark-plus" viewBox="0 0 16 16">
              <path
                d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z" />
              <path
                d="M8 4a.5.5 0 0 1 .5.5V6H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V7H6a.5.5 0 0 1 0-1h1.5V4.5A.5.5 0 0 1 8 4" />
            </svg>
            Add a Motor
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Button trigger REMOVE modal -->
  <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#exampleModal3"
    onclick="optionToRemove()">
    Remove Car
  </button>
  <!-- Motor Modal -->
  <div class="modal fade" id="exampleModal3" tabindex="-1" aria-labelledby="exampleModalLabel3" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">
        <!--modalHeader-->
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel3">
            <img src="./img/logo.png" alt="" width="30" height="24" class="d-inline-block align-text-top" />
            Kaioba's-Garage
          </h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!--modalBody-->
        <div class="modal-body" id="modalRemove">

        </div>
        <!--footerModal-->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  
  <!-- Button trigger show modal -->
  <button type="button" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#exampleModal4"
    onclick="showMotor()">
    motor
  </button>
  <!-- Motor Modal -->
  <div class="modal fade" id="exampleModal4" tabindex="-1" aria-labelledby="exampleModalLabel4" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">
        <!--modalHeader-->
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel4">
            <img src="./img/logo.png" alt="" width="30" height="24" class="d-inline-block align-text-top" />
            Kaioba's-Garage
          </h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!--modalBody-->
        <div class="modal-body" id="modalShow">

        </div>
        <!--footerModal-->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  



  <script src="./js/jquery-4.0.0.min.js"></script>
  <script src="./js/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
  </script>
</body>

</html>
